name: Backend CI

# Se ejecuta en cada push y en cada Pull Request.
on:
  push:
  pull_request:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    # PostgreSQL efímero para las pruebas de integración (Fase 2, F2-06).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lumi
          POSTGRES_PASSWORD: lumi
          POSTGRES_DB: lumi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumi -d lumi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Base dedicada a pruebas: el fixture borra y recrea el esquema.
      TEST_DATABASE_URL: postgresql+psycopg://lumi:lumi@localhost:5432/lumi_test
      APP_ENV: test

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Formato
        run: ruff format --check .

      - name: Pruebas
        run: pytest
