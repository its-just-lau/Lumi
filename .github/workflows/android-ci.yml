name: Android CI

# Se ejecuta en cada push a una rama de trabajo y en cada Pull Request hacia main/develop.
on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar, lint y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x ./gradlew

      # local.properties no existe en CI: la app usa las URLs por defecto y el login con Google queda sin configurar.
      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --stacktrace

      - name: Guardar reportes de pruebas y lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: lumi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
