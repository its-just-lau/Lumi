# Configuración de Alembic para Lumi.
# La URL de la base se toma de `DATABASE_URL` (backend/.env), no de este archivo.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os
# Se deja vacía a propósito: `alembic/env.py` usa la configuración de la app.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
